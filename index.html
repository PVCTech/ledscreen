<!DOCTYPE html>
<head>
  <title>LED screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/ledscreen/index_files/style.css">
</head>
<body>
  <h1>Bảng LED Fullscreen</h1>

  <div class="form-group">
      <label>Nội dung</label>
      <textarea id="message"></textarea>
  </div>
  
  <div class="row">
  
  
  <div>
      <label>Màu chữ</label>
      <input
          type="color"
          id="textColor"
          value="#ffff00" style="border:0px;border-radius:8px;padding:3px;">>
  </div>
  
  <div>
      <label>Màu nền</label>
      <input
          type="color"
          id="bgColor"
          value="#ff0000" style="border:0px;border-radius:8px;padding:3px;">
  </div>
  
  <div>
      <label>Tốc độ</label>
      <input
          type="range"
          id="speed"
          min="1"
          max="20"
          value="4" style="border:0px;border-radius:8px;padding:3px;">>
  </div>
  
  <div>
      <button id="startBtn">
           <Marquee style="width:120px;">Hiện bảng LED</Marquee>
      </button>
  </div>
  
  </div>
  
  <div id="ledScreen">
  
  
  <div id="ledText"></div>
  
  <button id="closeBtn">
      ✕ Đóng
  </button>
</body>
<script src="/ledscreen/index_files/main.js?v=1"></script>
